name: Ultimate Auto Find and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Uploaded Project
      run: |
        unzip -o QX_PRO_READY_AndroidIDE.zip

    - name: Find Project and Setup Gradle
      run: |
        # settings.gradle বা build.gradle যেখানে আছে সেই ফোল্ডার খুঁজে বের করবে
        PROJECT_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
        echo "Project directory found at: $PROJECT_DIR"
        
        # ফাইলগুলো মেইন ডিরেক্টরিতে সরিয়ে নিয়ে আসবে
        if [ "$PROJECT_DIR" != "." ]; then
          cp -rn "$PROJECT_DIR"/* .
          cp -rn "$PROJECT_DIR"/.* . 2>/dev/null || true
        fi
        
        # gradlew না থাকলে বানিয়ে নিবে
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QX-Pro-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
