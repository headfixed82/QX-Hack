name: Build APK from QX_PRO_READY

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Uploaded Project
      run: |
        unzip -o QX_PRO_READY_AndroidIDE.zip

    - name: Setup Gradle & Build APK
      run: |
        cd QX_PRO_READY
        
        # gradlew না থাকলে বা কাজ না করলে নতুন wrapper তৈরি করবে
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QX-Pro-APK
        path: "QX_PRO_READY/app/build/outputs/apk/debug/*.apk"
