name: Auto Find Deep Project and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Uploaded Project
      run: |
        unzip -o QX_PRO_READY_AndroidIDE.zip

    - name: Deep Find and Move Project Files
      run: |
        # জিপের ভেতর যত গভীরেই থাকুক, gradlew ফাইল খুঁজে বের করবে
        GRADLEW_PATH=$(find . -mindepth 2 -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project deeply nested in: $DIR"
          # আসল ফোল্ডারের সব ফাইল মেইন ডিরেক্টরিতে নিয়ে আসবে
          cp -r "$DIR"/* .
          cp -r "$DIR"/.* . 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QX-Pro-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
