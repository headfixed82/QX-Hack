name: Build APK from QX_PRO_READY

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Uploaded Project
      run: |
        unzip -o QX_PRO_READY_AndroidIDE.zip

    - name: Make gradlew Executable & Build APK
      run: |
        # QX_PRO_READY ফোল্ডারে যাওয়া
        cd QX_PRO_READY
        
        # Permission দেওয়া
        chmod +x gradlew
        
        # Debug APK বিল্ড
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QX-Pro-APK
        path: "**/build/outputs/apk/debug/*.apk"
