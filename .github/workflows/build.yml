name: Auto Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Uploaded Project
      run: |
        unzip -o QX_PRO_READY_AndroidIDE.zip
        ls -la

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          cd QX_PRO_READY_AndroidIDE && ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QX-Pro-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
